    background: var(--bg);

  main { width: min(820px, 100%); text-align: center; }

  .label {
    color: var(--mid);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .38em;
    text-transform: uppercase;
    margin: 0 0 1.1rem;
  }

  .count {
    margin: 0;
    font-family: "DM Sans", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(4rem, 17vw, 8.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .count sup {
    font-size: .38em;
    margin-left: .08em;
    letter-spacing: 0;
    color: var(--gold);
    vertical-align: super;
  }

  /* ---------- Frase (typing come why.com) ---------- */
  .phrase-wrap {
    display: grid;
    place-items: center;
    min-height: 4.6em;
    margin: 2.4rem auto 0;
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(1.55rem, 4.2vw, 2.6rem);
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.18;
    text-wrap: balance;
  }
  .phrase { max-width: 650px; cursor: pointer; }
  .phrase.is-typing::after {
    content: "";
    display: inline-block;
    width: 1px;
    height: .82em;
    margin-left: .09em;
    background: var(--gold-hi);
    box-shadow: 0 0 8px rgba(196, 170, 114, .45);
    vertical-align: -.03em;
    animation: cursor .72s steps(1) infinite;
  }
  @keyframes cursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* ---------- Setup ---------- */
  #setup h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: -0.02em;
    margin: 0 0 2rem;
  }
  form {
    display: flex;
    gap: .6rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  input {
    font: 500 1.05rem "DM Sans", system-ui, sans-serif;
    color: var(--hi);
    background: var(--field);
    border: 1px solid var(--low);
    border-radius: 999px;
    padding: .8rem 1.3rem;
    color-scheme: inherit;
    outline: none;
    transition: border-color .25s;
  }
  input:focus { border-color: var(--gold); }
  button.primary {
    font: 700 .72rem "DM Sans", system-ui, sans-serif;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--hi);
    border: 0;
    border-radius: 999px;
    padding: 0 1.6rem;
    min-height: 48px;
    cursor: pointer;
    transition: opacity .2s;
  }
  button.primary:hover { opacity: .85; }

  .corner {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: 16px;
    display: flex;
    gap: .4rem;
  }
  .corner button {
    font: 700 .58rem "DM Sans", system-ui, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--mid);
    background: transparent;
    border: 1px solid var(--low);
    border-radius: 999px;
    padding: .55rem .9rem;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .corner button:hover { color: var(--gold-hi); border-color: var(--gold); }

  .credit {
    position: fixed;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 16px;
    margin: 0;
    color: var(--mid);
    font-size: .72rem;
    line-height: 1.3;

    text-decoration: underline;
    text-decoration-color: var(--low);
    text-underline-offset: 3px;
    transition: color .2s;
  }
  .credit a:hover { color: var(--gold-hi); }

    .credit { left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); text-align: center; }

  [hidden] { display: none !important; }

<main>

    </form>
  </section>

  <section id="timer" hidden>

    <h2 class="count" id="age" aria-label="Your age in years">0<sup>.000000000</sup></h2>
    <div class="phrase-wrap">
      <span class="phrase" id="phrase" aria-live="polite" title="Click for the next one"></span>
    </div>
  </section>
</main>

<p class="credit">Inspired by <a href="https://jacky-liang.github.io/age-timer/" target="_blank" rel="noopener">Age Timer</a> by Jacky Liang</p>

  // ---------- Elementi ----------
  const $ = (id) => document.getElementById(id);
  const setup = $("setup"), timer = $("timer"), corner = $("corner");
  const ageEl = $("age"), phraseEl = $("phrase");
  const form = $("dobForm"), dateIn = $("dobDate"), timeIn = $("dobTime");
  const themeBtn = $("themeBtn"), resetBtn = $("resetBtn");
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");

  // ---------- Storage sicuro ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  let memDob = null; // fallback se localStorage non è disponibile

  // ---------- Tema: auto (sistema) / chiaro / scuro ----------
  const THEMES = ["auto", "light", "dark"];
  let theme = store.get("ptw-theme") || "auto";
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "auto" ? "Auto" : theme === "light" ? "Light" : "Dark";
  }
  themeBtn.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    store.set("ptw-theme", theme);
    applyTheme();
  });
  applyTheme();

  // ---------- Timer: 9 decimali come la reference ----------
  const YEAR_MS = 31556900000; // stessa costante dell'age-timer
  let dob = null, rafId = null, lastText = "";

  function renderAge() {
    const years = (Date.now() - dob) / YEAR_MS;
    const parts = Math.max(0, years).toFixed(9).split(".");
    const text = parts[0] + "." + parts[1];
    if (text !== lastText) {
      ageEl.innerHTML = parts[0] + "<sup>." + parts[1] + "</sup>";
      lastText = text;
    }
    rafId = requestAnimationFrame(renderAge);
  }

  // ---------- Frasi: typing stile why.com ----------
  let bag = [], typingTimer = null, holdTimer = null, current = "";

  function nextPhrase() {
    if (!bag.length) {
      bag = PHRASES.slice();
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      if (bag[bag.length - 1] === current && bag.length > 1) {
        [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      }
    }
    current = bag.pop();
    return current;
  }

  function stopPhrases() {
    clearTimeout(typingTimer);
    clearTimeout(holdTimer);
  }

  function scheduleNext() {
    clearTimeout(holdTimer);
    holdTimer = setTimeout(showPhrase, 4600);
  }

  function typePhrase(text) {
    const chars = Array.from(text);
    const pace = Math.max(25, Math.min(52, 1450 / Math.max(1, chars.length)));
    let i = 0;
    phraseEl.textContent = "";
    phraseEl.classList.add("is-typing");
    const step = () => {
      if (i >= chars.length) {
        phraseEl.textContent = text;
        phraseEl.classList.remove("is-typing");
        scheduleNext();
        return;
      }
      const c = chars[i++];
      phraseEl.textContent += c;
      typingTimer = setTimeout(step, pace * (/[?!.:;,]/.test(c) ? 2.2 : 1));
    };
    typingTimer = setTimeout(step, 220);
  }

  function showPhrase() {
    stopPhrases();
    const text = nextPhrase();
    if (REDUCED.matches) {
      phraseEl.textContent = text;
      phraseEl.classList.remove("is-typing");
      scheduleNext();
    } else {
      typePhrase(text);
    }
  }

  phraseEl.addEventListener("click", showPhrase);
  document.addEventListener("keydown", (e) => {
    if (timer.hidden) return;
    if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); showPhrase(); }
  });

  // ---------- Viste ----------
  function startTimer() {
    setup.hidden = true;
    timer.hidden = false;
    corner.hidden = false;
    cancelAnimationFrame(rafId);
    lastText = "";
    renderAge();
    showPhrase();
  }

  function showSetup() {
    cancelAnimationFrame(rafId);
    stopPhrases();
    timer.hidden = true;
    corner.hidden = false;
    resetBtn.hidden = true;
    setup.hidden = false;
    dateIn.max = new Date().toISOString().slice(0, 10);
    dateIn.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!dateIn.value) return;
    const [y, m, d] = dateIn.value.split("-").map(Number);
    const [hh, mm] = (timeIn.value || "00:00").split(":").map(Number);
    const value = new Date(y, m - 1, d, hh || 0, mm || 0).getTime();
    if (!isFinite(value) || value > Date.now()) return;
    dob = value;
    memDob = value;
    store.set("ptw-dob", String(value));
    resetBtn.hidden = false;
    startTimer();
  });

  resetBtn.addEventListener("click", () => {
    store.del("ptw-dob");
    memDob = null;
    showSetup();
  });

  // ---------- Avvio ----------
  const saved = parseInt(store.get("ptw-dob") || memDob, 10);
  if (isFinite(saved)) { dob = saved; startTimer(); }
  else showSetup();
})();
